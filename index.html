<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convite 🐱</title>
<style>
  :root{
    --pink: #ffd6e8;
    --pink-deep: #ff9ec7;
    --text: #7a2e4d;
    --yes: #ff6fa5;
    --yes-dark: #e14e86;
    --no-light: #ffe4f0;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, var(--pink) 0%, var(--pink-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
    overflow: hidden;
  }
  .stage{
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 92vh;
    max-height: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card{
    position: relative;
    width: 100%;
    text-align: center;
    padding: 12px 12px 40px;
  }
  .cat-img{
    width: 260px;
    max-width: 85%;
    height: auto;
    display: block;
    margin: 0 auto 8px;
    filter: drop-shadow(0 10px 18px rgba(200, 60, 120, 0.35));
  }
  h1{
    color: var(--text);
    font-size: 1.35rem;
    line-height: 1.4;
    margin: 8px 0 36px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .buttons{
    position: relative;
    height: 260px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .btn{
    position: absolute;
    top: 0;
    border: none;
    border-radius: 20px;
    padding: 26px 40px;
    font-size: 1.25rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s ease;
    touch-action: manipulation;
    min-width: 165px;
  }
  .btn-sim{
    left: calc(50% - 175px);
    background: var(--no-light);
    color: var(--yes-dark);
    box-shadow: 0 4px 10px rgba(225, 78, 134, 0.2);
  }
  .btn-sim:active{ transform: scale(0.95); }
  .btn-nao{
    left: calc(50% + 10px);
    background: var(--no-light);
    color: var(--yes-dark);
    box-shadow: 0 4px 10px rgba(225, 78, 134, 0.2);
  }
  .result{ display: none; }
  .result.show{ display: block; }
  .card.hide-question .question{ display: none; }
  .result .cat-img{
    width: 280px;
  }
  .result h1{ margin-bottom: 6px; }
  .result p{
    color: var(--text);
    opacity: 0.85;
    margin: 0;
    font-size: 0.95rem;
  }
  .hearts{ font-size: 1.4rem; margin-top: 14px; }
</style>
</head>

<script>
  const btnNao = document.getElementById('btnNao');
  const btnSim = document.getElementById('btnSim');
  const buttons = document.getElementById('buttons');
  const card = document.getElementById('card');
  const result = document.getElementById('result');

  function fugir(){
    const areaRect = buttons.getBoundingClientRect();
    const simRect = btnSim.getBoundingClientRect();
    const btnW = btnNao.offsetWidth;
    const btnH = btnNao.offsetHeight;

    const maxLeft = Math.max(0, areaRect.width - btnW);
    const maxTop = Math.max(0, areaRect.height - btnH);

    const margin = 16;
    const simLeft = simRect.left - areaRect.left - margin;
    const simTop = simRect.top - areaRect.top - margin;
    const simRight = simLeft + simRect.width + margin * 2;
    const simBottom = simTop + simRect.height + margin * 2;

    let newLeft, newTop, tries = 0;
    do {
      newLeft = Math.random() * maxLeft;
      newTop = Math.random() * maxTop;
      tries++;
    } while (
      tries < 40 &&
      newLeft < simRight &&
      newLeft + btnW > simLeft &&
      newTop < simBottom &&
      newTop + btnH > simTop
    );

    btnNao.style.left = newLeft + 'px';
    btnNao.style.top = newTop + 'px';
  }

  btnNao.addEventListener('click', function(e){
    e.preventDefault();
    fugir();
  });
  btnNao.addEventListener('touchstart', function(e){
    e.preventDefault();
    fugir();
  }, {passive:false});

  btnSim.addEventListener('click', function(){
    card.classList.add('hide-question');
    result.classList.add('show');
  });
</script>
